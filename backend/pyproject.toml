[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16.5",
    "fastapi-guard>=4.1.2",
    "fastapi-pagination>=0.14.2",
    "fastapi[standard]>=0.118.0",
    "google-cloud-aiplatform>=1.139.0",
    "google-genai>=1.65.0",
    "loguru>=0.7.3",
    "openai>=2.24.0",
    "pydantic-settings>=2.11.0",
    "psycopg2-binary>=2.9.10",
    "python-dotenv>=1.2.2",
    "PyYAML>=6.0",
    "sqlmodel>=0.0.25",
    "ulid-py>=1.1.0",
]

[tool.uv]
default-groups = ["dev", "model_armor", "observability", "prompt-validation"]

[dependency-groups]
dev = [
    "locust>=2.41.5",
    "pytest>=9.0.3",
    "pytest-cov>=7.0.0",
    "ruff>=0.13.3",
    "taskipy>=1.14.1",
]
model_armor = [
    "google-cloud-modelarmor>=0.4.0",
]
observability = [
    "langtrace-python-sdk>=3.8.21",
    "opentelemetry-api>=1.39.1",
    "opentelemetry-sdk>=1.39.1",
]
prompt-validation = [
    "google-genai>=1.65.0",
    "openai>=2.24.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.2",
    "PyYAML>=6.0",
]

[tool.ruff]
target-version = "py313"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.pytest.ini_options]
pythonpath = "."

[tool.taskipy.tasks]
dev = "uv run fastapi dev"
format = "ruff check --fix && ruff format ."
test = "pytest --cov --cov-report=html"
load-test = "locust -f load_testing/locustfile.py --host=http://localhost:8000 "
load-test-tags = "locust -f load_testing/locustfile.py --host=http://localhost:8000 --tags" # uv run task load-test-tags list_samples create_sample
